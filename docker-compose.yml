services:
  postgres:
    image: postgres:16-alpine
    container_name: workbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WB_DB_NAME:-workbench}
      POSTGRES_USER: ${WB_DB_USER:-workbench}
      POSTGRES_PASSWORD: ${WB_DB_PASSWORD:?set WB_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WB_DB_USER:-workbench} -d ${WB_DB_NAME:-workbench}"]
      interval: 5s
      timeout: 3s
      retries: 20
